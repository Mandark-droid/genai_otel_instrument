name: Bug report
description: Report a reproducible problem with genai-otel-instrument.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first. Do not include API keys, personal data,
        prompts, completions, or unredacted telemetry in this report.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Provide a small example with secrets and customer content removed.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: genai-otel-instrument version
      placeholder: e.g. 1.42.0
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.13.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, Windows 11, macOS 15
    validations:
      required: true
  - type: textarea
    id: sdk
    attributes:
      label: Provider or framework SDK and version
      description: Include the relevant SDK or agent framework version, if applicable.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant error or logs
      description: Redact credentials, prompts, completions, and identifying data.
      render: text
    validations:
      required: false
